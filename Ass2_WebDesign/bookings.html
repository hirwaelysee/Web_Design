<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Booking Rate Calculator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/booking.css">
</head>
<body>

    <header>
        <nav>
            <ul class="nav-menu">
                <li><a href="home_page.html"><i class="fa-solid fa-house"></i>Home</a></li>
                <li><a href="bookings.html">Bookings</a></li>
                <li><a href="contact.html"><i class="fa-solid fa-phone"></i>Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h1>Hotel Booking Rate Calculator</h1>
        
        <div class="calculator-card">
            <div class="form-group">
                <label for="nights">Enter number of nights:</label>
                <input type="number" id="nights" min="1" placeholder="ex: 3">
            </div>
            
            <button type="button" id="checkRateBtn">Check Rate</button>
            
            <div id="resultDisplay" class="result-display"></div>
            
            <div id="bookingLinkContainer" class="link-container"></div>
        </div>
    </main>
    <script src="js/booking.js"></script>
</body>
</html>
